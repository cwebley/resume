<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Subtle Accent Accent for the W -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)"/>

  <!-- Subtle Border Ring -->
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="8" opacity="0.8"/>

  <!-- Initial Text "CW" -->
  <g filter="url(#glow)">
    <text
      x="256"
      y="330"
      font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Inter', 'Segoe UI', sans-serif"
      font-weight="700"
      font-size="230"
      letter-spacing="-12"
      text-anchor="middle"
      fill="url(#textGradient)">
      <tspan fill="#ffffff">C</tspan><tspan fill="#94a3b8" dx="-8">W</tspan>
    </text>
  </g>
</svg>
